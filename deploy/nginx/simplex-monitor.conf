# nginx site for the SimpleX Monitor dashboard.
# Replace monitor.example.com with your hostname, then:
#   ln -s /etc/nginx/sites-available/simplex-monitor.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d monitor.example.com
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    location / {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
