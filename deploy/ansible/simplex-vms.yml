---
# Prepares each SMP/XFTP VM for simplex-monitor:
#  1. Enables Prometheus metrics in the server INI ([STORE_LOG] prometheus_interval)
#  2. Installs node_exporter and exposes the SimpleX metrics file through its
#     textfile collector (metrics have no timestamps, so a symlink is valid)
#  3. Firewalls :9100 so only the monitoring VPS can scrape
#  4. Creates the restricted 'smmonitor' user for dashboard restarts/log tails
#
# Run: ansible-playbook -i inventory.ini simplex-vms.yml
- name: Prepare SimpleX VMs for monitoring
  hosts: all
  become: true
  vars:
    unit_name: "{{ 'smp-server' if simplex_kind == 'smp' else 'xftp-server' }}"
    ini_path: "{{ '/etc/opt/simplex/smp-server.ini' if simplex_kind == 'smp' else '/etc/opt/simplex-xftp/xftp-server.ini' }}"
    metrics_file: "{{ '/var/opt/simplex/smp-server-metrics.txt' if simplex_kind == 'smp' else '/var/opt/simplex-xftp/xftp-server-metrics.txt' }}"
    textfile_dir: /var/lib/prometheus/node-exporter

  tasks:
    - name: Enable Prometheus metrics in server INI
      community.general.ini_file:
        path: "{{ ini_path }}"
        section: STORE_LOG
        option: prometheus_interval
        value: '60'
        no_extra_spaces: true
      notify: restart simplex server

    - name: Install node_exporter and ufw
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - ufw
        state: present
        update_cache: true

    - name: Enable node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Ensure textfile collector directory exists
      ansible.builtin.file:
        path: "{{ textfile_dir }}"
        state: directory
        mode: '0755'

    - name: Expose SimpleX metrics via textfile collector symlink
      ansible.builtin.file:
        src: "{{ metrics_file }}"
        dest: "{{ textfile_dir }}/simplex.prom"
        state: link
        force: true
        follow: false

    - name: Allow node_exporter scrapes from the monitoring VPS only
      community.general.ufw:
        rule: allow
        port: '9100'
        proto: tcp
        from_ip: "{{ monitor_vps_ip }}"

    - name: Deny node_exporter from everywhere else
      community.general.ufw:
        rule: deny
        port: '9100'
        proto: tcp

    - name: Create smmonitor user (journal access, no login shell tricks)
      ansible.builtin.user:
        name: smmonitor
        shell: /bin/bash
        groups: systemd-journal
        append: true
        create_home: true

    - name: Authorize the monitor VPS key (forwarding disabled)
      ansible.posix.authorized_key:
        user: smmonitor
        key: "{{ monitor_pubkey }}"
        key_options: 'no-port-forwarding,no-X11-forwarding,no-agent-forwarding'

    - name: Allow exactly one privileged command - restarting the SimpleX unit
      ansible.builtin.copy:
        dest: /etc/sudoers.d/smmonitor
        mode: '0440'
        validate: 'visudo -cf %s'
        content: |
          smmonitor ALL=(root) NOPASSWD: /usr/bin/systemctl restart {{ unit_name }}.service

  handlers:
    - name: restart simplex server
      ansible.builtin.systemd:
        name: "{{ unit_name }}"
        state: restarted
