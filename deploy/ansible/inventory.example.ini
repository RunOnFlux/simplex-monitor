# Inventory for the 12 SimpleX VMs. Copy to inventory.ini and adjust.
[smp]
smp1.simplexonflux.com
smp2.simplexonflux.com
smp3.simplexonflux.com
smp4.simplexonflux.com
smp5.simplexonflux.com
smp6.simplexonflux.com

[xftp]
xftp1.simplexonflux.com
xftp2.simplexonflux.com
xftp3.simplexonflux.com
xftp4.simplexonflux.com
xftp5.simplexonflux.com
xftp6.simplexonflux.com

[smp:vars]
simplex_kind=smp

[xftp:vars]
simplex_kind=xftp

[all:vars]
ansible_user=root
# IP of the monitoring VPS - the only host allowed to scrape node_exporter
monitor_vps_ip=CHANGE_ME
# Contents of /opt/simplex-monitor/keys/smmonitor_ed25519.pub from the VPS
monitor_pubkey=CHANGE_ME
